<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>陳念誠 · Photofolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Hover helpers for components defined inline */
    .social-row { transition: padding-left .35s cubic-bezier(.2,.7,.2,1), color .35s; }
    .social-row::before {
      content: "";
      position: absolute;
      left: -22px; top: 50%;
      width: 0; height: 1px;
      background: var(--rust);
      transition: width .35s cubic-bezier(.2,.7,.2,1);
    }
    .social-row:hover { padding-left: 22px; color: var(--rust); }
    .social-row:hover::before { width: 14px; }

    .index-row { transition: background .35s, color .35s; }
    .index-row:hover { background: var(--ink); color: var(--paper-soft); }
    .index-row:hover .mono { color: var(--rust-soft); }
    .index-row:hover > div { color: inherit; }

    .cover-button .cover-img { transition: transform 1.4s cubic-bezier(.2,.7,.2,1), filter .6s; }
    .cover-button:hover .cover-img {
      transform: scale(1.05);
      filter: sepia(0.05) saturate(1) contrast(1);
    }

    .open-btn:hover { background: var(--ink); color: var(--paper-soft); }
    .open-btn:hover span { color: var(--rust-soft); }

    .photo-frame img { transition: filter .6s; }
    .photo-frame:hover img { filter: sepia(0) saturate(1.05) contrast(1.02); }

    .next-album:hover .next-cover { transform: scale(1.04); }

    /* Responsive — collapse to single column on narrow screens */
    @media (max-width: 900px) {
      .reveal { transition-duration: .8s; }
      section[style*="grid-template-columns"],
      header[style*="grid-template-columns"],
      div[style*="grid-template-columns"],
      article[style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
      }
      .album-row { gap: 32px !important; padding: 60px 0 !important; }
      h1 { font-size: 72px !important; }
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- data -->
  <script src="data.js"></script>

  <!-- components -->
  <script type="text/babel" data-presets="react" src="cursor.jsx"></script>
  <script type="text/babel" data-presets="react" src="home.jsx"></script>
  <script type="text/babel" data-presets="react" src="album.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
